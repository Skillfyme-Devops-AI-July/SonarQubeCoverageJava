name: Code Coverage Workflow using Sonarqube
on: push 
jobs:
  job_sonar:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout the code on runner VM
      uses: actions/checkout@v7 
    - name: Set up Java
      uses: actions/setup-java@v7
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Code Coverage using sonarqube 
      run: mvn sonar:sonar -Dsonar.projectKey=sonarqube-actions-org-aug2026_sonarqube-actions-project -Dsonar.host.url=https://sonarcloud.io/ -Dsonar.organization=sonarqube-actions-org-aug2026 -Dsonar.token=$SONAR_TOKEN
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
