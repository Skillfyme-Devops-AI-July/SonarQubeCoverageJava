name: Workflow to build and Review the code using SonarCloud

on:
  workflow_dispatch:
    inputs:
      job_maven:
        description: 'Run the maven job'
        required: true
        type: boolean

      job_sonar:
        description: 'Run the sonar job'
        required: true
        type: boolean

jobs:
  job_maven:
    if: ${{ inputs.job_maven }}
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code on runner VM
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build the code using Maven
        run: mvn clean install

  job_sonar:
    if: ${{ inputs.job_sonar }}
    needs: job_maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code on runner VM
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Code Coverage using SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR-TOKEN }}
        run: |
          mvn -B verify \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar \
            -Dsonar.projectKey=sonar-demo-new_sonar-demo \
            -Dsonar.host.url=https://sonarcloud.io/ \
            -Dsonar.organization=sonar-demo-new \
            -Dsonar.token=$SONAR_TOKEN
