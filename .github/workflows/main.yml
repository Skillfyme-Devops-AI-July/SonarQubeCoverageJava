name: Workflow to build and Review the code using Sonarqube
on:  
 workflow_dispatch:  # this will allow us to run the workflow manually from the github repo
   inputs:
    job_name:  # this is the name of the input parameter which we will pass while running the workflow manually
      description: 'Enter the job name to run'  # this is the description of the input parameter
      required: true  # this will make the input parameter mandatory
      type: choice  # this will make the input parameter a choice type
      options:  # these are the options which we will get while running the workflow manually
        - job_maven
        - job_sonar
jobs:
  job_maven: 
    if: ${{ github.event.inputs.job_name == 'job_maven' }}  # this will check if the input parameter is job_maven or not
    continue-on-error: true # if the job fails, the next job will still run
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout the code on runner VM
      uses: actions/checkout@v7 
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build the code using maven 
      run: mvn clean install       
  job_sonar:
    if: ${{ github.event.inputs.job_name == 'job_sonar' }}  # this will check if the input parameter is job_sonar or not
    needs: job_maven # this job_sonar job will run after the successful completion of job_maven
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout the code on runner VM
      uses: actions/checkout@v7 
    - name: Set up Java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Code Coverage using sonarqube 
      run: mvn  -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.2.0.4988:sonar -Dsonar.projectKey=sonarqube-actions-org-aug2026_sonarqube-actions-project -Dsonar.host.url=https://sonarcloud.io/ -Dsonar.organization=sonarqube-actions-org-aug2026 -Dsonar.token=$SONAR_TOKEN
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
